# CustodyChain BFT test network: 4 BFT orderers (one per agency) + 3 peers (Police, FSL, Court).
# Every ledger lives in a named volume, so `network.sh stop` / `start` and host reboots keep all data;
# only `network.sh down` deletes the volumes.
name: custodychain-bft

x-orderer-env: &orderer-env
  FABRIC_LOGGING_SPEC: INFO
  ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
  ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
  ORDERER_GENERAL_TLS_ENABLED: "true"
  ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
  ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
  ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
  ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
  ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
  # Consenters of other agencies present certificates from other CAs: trust all four TLS CAs.
  ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/tlsca/police.pem,/var/hyperledger/tlsca/fsl.pem,/var/hyperledger/tlsca/court.pem,/var/hyperledger/tlsca/prosecution.pem]"
  ORDERER_GENERAL_BOOTSTRAPMETHOD: none
  ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
  ORDERER_ADMIN_TLS_ENABLED: "true"
  ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
  ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
  ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
  ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
  ORDERER_METRICS_PROVIDER: prometheus

x-peer-env: &peer-env
  FABRIC_LOGGING_SPEC: INFO
  CORE_PEER_TLS_ENABLED: "true"
  CORE_PEER_PROFILE_ENABLED: "false"
  CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/crypto/tls/server.crt
  CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/crypto/tls/server.key
  CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/crypto/tls/ca.crt
  CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/crypto/msp
  CORE_METRICS_PROVIDER: prometheus
  CORE_CHAINCODE_EXECUTETIMEOUT: 300s

x-common: &common
  labels:
    service: hyperledger-fabric
  networks: [bft]
  working_dir: /root

volumes:
  orderer.police.custodychain.local:
  orderer.fsl.custodychain.local:
  orderer.court.custodychain.local:
  orderer.prosecution.custodychain.local:
  peer0.police.custodychain.local:
  peer0.fsl.custodychain.local:
  peer0.court.custodychain.local:

networks:
  bft:
    name: custodychain_bft

services:
  # ------------------------------------------------------------------ BFT consenters
  orderer.police.custodychain.local:
    <<: *common
    container_name: orderer.police.custodychain.local
    image: hyperledger/fabric-orderer:3.1.5
    command: orderer
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_LOCALMSPID: PoliceOrdererMSP
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
    volumes:
      - ./organizations/ordererOrganizations/police.custodychain.local/orderers/orderer.police.custodychain.local/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/police.custodychain.local/orderers/orderer.police.custodychain.local/tls:/var/hyperledger/orderer/tls
      - ./organizations/tlsca:/var/hyperledger/tlsca:ro
      - orderer.police.custodychain.local:/var/hyperledger/production/orderer
    ports: ["7050:7050", "7053:7053", "9443:9443"]

  orderer.fsl.custodychain.local:
    <<: *common
    container_name: orderer.fsl.custodychain.local
    image: hyperledger/fabric-orderer:3.1.5
    command: orderer
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 8050
      ORDERER_GENERAL_LOCALMSPID: FSLOrdererMSP
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:8053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9444
    volumes:
      - ./organizations/ordererOrganizations/fsl.custodychain.local/orderers/orderer.fsl.custodychain.local/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/fsl.custodychain.local/orderers/orderer.fsl.custodychain.local/tls:/var/hyperledger/orderer/tls
      - ./organizations/tlsca:/var/hyperledger/tlsca:ro
      - orderer.fsl.custodychain.local:/var/hyperledger/production/orderer
    ports: ["8050:8050", "8053:8053", "9444:9444"]

  orderer.court.custodychain.local:
    <<: *common
    container_name: orderer.court.custodychain.local
    image: hyperledger/fabric-orderer:3.1.5
    command: orderer
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 11050
      ORDERER_GENERAL_LOCALMSPID: CourtOrdererMSP
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:11053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9445
    volumes:
      - ./organizations/ordererOrganizations/court.custodychain.local/orderers/orderer.court.custodychain.local/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/court.custodychain.local/orderers/orderer.court.custodychain.local/tls:/var/hyperledger/orderer/tls
      - ./organizations/tlsca:/var/hyperledger/tlsca:ro
      - orderer.court.custodychain.local:/var/hyperledger/production/orderer
    ports: ["11050:11050", "11053:11053", "9445:9445"]

  orderer.prosecution.custodychain.local:
    <<: *common
    container_name: orderer.prosecution.custodychain.local
    image: hyperledger/fabric-orderer:3.1.5
    command: orderer
    environment:
      <<: *orderer-env
      ORDERER_GENERAL_LISTENPORT: 10050
      ORDERER_GENERAL_LOCALMSPID: ProsecutionOrdererMSP
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:10053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9446
    volumes:
      - ./organizations/ordererOrganizations/prosecution.custodychain.local/orderers/orderer.prosecution.custodychain.local/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/prosecution.custodychain.local/orderers/orderer.prosecution.custodychain.local/tls:/var/hyperledger/orderer/tls
      - ./organizations/tlsca:/var/hyperledger/tlsca:ro
      - orderer.prosecution.custodychain.local:/var/hyperledger/production/orderer
    ports: ["10050:10050", "10053:10053", "9446:9446"]

  # ------------------------------------------------------------------ agency peers
  peer0.police.custodychain.local:
    <<: *common
    container_name: peer0.police.custodychain.local
    image: hyperledger/fabric-peer:3.1.5
    command: peer node start
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.police.custodychain.local
      CORE_PEER_ADDRESS: peer0.police.custodychain.local:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.police.custodychain.local:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.police.custodychain.local:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.police.custodychain.local:7051
      CORE_PEER_LOCALMSPID: PoliceMSP
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9451
      CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG: '{"peername":"police"}'
    volumes:
      - ./organizations/peerOrganizations/police.custodychain.local/peers/peer0.police.custodychain.local:/etc/hyperledger/crypto
      - peer0.police.custodychain.local:/var/hyperledger/production
    ports: ["7051:7051", "9451:9451"]

  peer0.fsl.custodychain.local:
    <<: *common
    container_name: peer0.fsl.custodychain.local
    image: hyperledger/fabric-peer:3.1.5
    command: peer node start
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.fsl.custodychain.local
      CORE_PEER_ADDRESS: peer0.fsl.custodychain.local:8051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:8051
      CORE_PEER_CHAINCODEADDRESS: peer0.fsl.custodychain.local:8052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:8052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.fsl.custodychain.local:8051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.fsl.custodychain.local:8051
      CORE_PEER_LOCALMSPID: FSLMSP
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9452
      CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG: '{"peername":"fsl"}'
    volumes:
      - ./organizations/peerOrganizations/fsl.custodychain.local/peers/peer0.fsl.custodychain.local:/etc/hyperledger/crypto
      - peer0.fsl.custodychain.local:/var/hyperledger/production
    ports: ["8051:8051", "9452:9452"]

  peer0.court.custodychain.local:
    <<: *common
    container_name: peer0.court.custodychain.local
    image: hyperledger/fabric-peer:3.1.5
    command: peer node start
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.court.custodychain.local
      CORE_PEER_ADDRESS: peer0.court.custodychain.local:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.court.custodychain.local:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.court.custodychain.local:9051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.court.custodychain.local:9051
      CORE_PEER_LOCALMSPID: CourtMSP
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9453
      CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG: '{"peername":"court"}'
    volumes:
      - ./organizations/peerOrganizations/court.custodychain.local/peers/peer0.court.custodychain.local:/etc/hyperledger/crypto
      - peer0.court.custodychain.local:/var/hyperledger/production
    ports: ["9051:9051", "9453:9453"]
